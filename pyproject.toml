[project]
name = "jarvis-local"
version = "0.1.0"
description = "Local terminal assistant with Ollama, SQLite memory, optional multi-agent mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit package list so `pip install .` always installs the `jarvis` package
# (auto-discovery can miss it in some setuptools versions).
[tool.setuptools]
packages = ["jarvis"]
