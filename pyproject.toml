[project]
name = "zedo-local"
version = "0.2.1"
description = "Zedo — local terminal assistant with Ollama, SQLite memory, Skills, optional multi-agent mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
zedo = "zedo.cli:main"
jarvis = "zedo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zedo"]
