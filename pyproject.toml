[project]
name = "jarvis"
version = "0.1.0"
description = "Local AI assistant inspired by Jarvis — runs entirely on your machine with no rate limits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
