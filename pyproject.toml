[project]
name = "jarvis-local"
version = "0.1.1"
description = "Local terminal assistant with Ollama, SQLite memory, optional multi-agent mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship only the `jarvis` package (flat layout at repo root).
[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
